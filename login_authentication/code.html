<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb693",
                    "surface-bright": "#f6faf9",
                    "on-secondary-container": "#54647a",
                    "on-primary-fixed-variant": "#004f50",
                    "tertiary-fixed": "#ffdbcc",
                    "outline-variant": "#bdc9c8",
                    "surface-tint": "#006a6a",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#632906",
                    "on-surface-variant": "#3e4949",
                    "surface-variant": "#dfe3e3",
                    "secondary-container": "#d0e1fb",
                    "primary-fixed-dim": "#74d6d6",
                    "on-surface": "#181c1c",
                    "inverse-on-surface": "#edf2f1",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#351000",
                    "secondary-fixed": "#d3e4fe",
                    "inverse-primary": "#74d6d6",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d6dbda",
                    "on-primary-fixed": "#002020",
                    "surface": "#f6faf9",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#004242",
                    "tertiary-container": "#e48f65",
                    "tertiary": "#914c27",
                    "primary-container": "#4fb3b3",
                    "on-background": "#181c1c",
                    "background": "#f6faf9",
                    "surface-container-highest": "#dfe3e3",
                    "secondary": "#505f76",
                    "primary": "#006a6a",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#0b1c30",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#38485d",
                    "inverse-surface": "#2c3131",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-tertiary-fixed-variant": "#733512",
                    "surface-container-low": "#f0f4f4",
                    "outline": "#6e7979",
                    "surface-container": "#eaefee",
                    "primary-fixed": "#91f3f2",
                    "surface-container-high": "#e5e9e8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "8px",
                    "md": "24px",
                    "gutter": "24px",
                    "xl": "64px",
                    "margin": "32px",
                    "lg": "48px",
                    "sm": "12px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "label-sm": ["Manrope"],
                    "headline-md": ["Manrope"],
                    "label-md": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "body-md": ["Manrope"],
                    "headline-xl": ["Manrope"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-xl": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #E0E5EC;
            font-family: 'Manrope', sans-serif;
        }
        .neumorphic-flat {
            background: #E0E5EC;
            box-shadow: 8px 8px 16px #B8BCC2, -8px -8px 16px #FFFFFF;
        }
        .neumorphic-inset {
            background: #E0E5EC;
            box-shadow: inset 6px 6px 12px #B8BCC2, inset -6px -6px 12px #FFFFFF;
        }
        .neumorphic-button {
            background: #E0E5EC;
            box-shadow: 6px 6px 12px #B8BCC2, -6px -6px 12px #FFFFFF;
            transition: all 0.2s ease-in-out;
        }
        .neumorphic-button:active {
            box-shadow: inset 4px 4px 8px #B8BCC2, inset -4px -4px 8px #FFFFFF;
            transform: scale(0.98);
        }
        .neumorphic-primary {
            background: #4FB3B3;
            box-shadow: 6px 6px 12px #B8BCC2, -6px -6px 12px #FFFFFF, inset 2px 2px 4px rgba(255,255,255,0.3);
            transition: all 0.2s ease-in-out;
        }
        .neumorphic-primary:active {
            box-shadow: inset 6px 6px 12px #3d8a8a, inset -6px -6px 12px #61dcdc;
        }
        .neumorphic-error {
            background: #fce8e8;
            box-shadow: inset 4px 4px 8px #d6c1c1, inset -4px -4px 8px #ffffff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<div class="w-full max-w-md p-lg rounded-[48px] neumorphic-flat space-y-md">
<!-- Header Section -->
<header class="text-center space-y-xs pb-sm">
<div class="flex justify-center mb-sm">
<div class="w-16 h-16 rounded-3xl neumorphic-button flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-3xl" data-icon="task_alt">task_alt</span>
</div>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight">Welcome Back</h1>
<p class="text-body-md font-body-md text-secondary">Sign in to continue your flow</p>
</header>
<!-- Error Alert State -->
<div class="neumorphic-error rounded-2xl p-sm flex items-center gap-sm text-error">
<span class="material-symbols-outlined" data-icon="error_outline">error_outline</span>
<span class="text-label-md font-label-md">Invalid email or password</span>
</div>
<!-- Form Section -->
<form class="space-y-md">
<!-- Email Input -->
<div class="space-y-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant ml-sm" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400" data-icon="mail">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-md rounded-2xl neumorphic-inset border-none focus:ring-0 text-body-md font-body-md text-on-surface placeholder:text-slate-400" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-sm">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="password">PASSWORD</label>
<a class="text-label-sm font-label-sm text-primary-container hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400" data-icon="lock">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-md rounded-2xl neumorphic-inset border-none focus:ring-0 text-body-md font-body-md text-on-surface placeholder:text-slate-400" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 rounded-2xl neumorphic-primary text-white font-headline-md tracking-wide mt-sm" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-sm py-xs">
<div class="flex-1 h-[2px] neumorphic-inset rounded-full"></div>
<span class="text-label-sm font-label-sm text-slate-400">OR CONTINUE WITH</span>
<div class="flex-1 h-[2px] neumorphic-inset rounded-full"></div>
</div>
<!-- Social Login Grid -->
<div class="grid grid-cols-2 gap-md">
<button class="h-14 rounded-2xl neumorphic-button flex items-center justify-center gap-sm hover:scale-[1.02] transition-transform">
<img alt="Google" class="w-5 h-5" data-alt="The colorful and iconic Google G logo centered on a clean white circular background. The lighting is neutral and the focus is sharp, following a clean, minimalist digital graphic design language. The overall aesthetic is professional and corporate, matching a modern software ecosystem." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC99p9OxNhcomm01YlE1rWA47q8IvqNtSzENaRQT7mINni8OPpwEh3JpKPtFBmt48AexlmBCceJ7UglHyoZDvT2l26fnsiMaRsGwAiQ_yB1TTcsigCIyhELfmRTRhsQGbSpr64diwdWLRmTqPMiCfYiJbxIiGmYFxwLydONunzAeJJHu1TnZf_q5BjNVjP27qXVfns8EEyhujxI5mUh9IZJPi-ikmeOlD_QEzdozsQeaSyMt4WahQ6D33HMFbFvEzJZDk3QtdF0a5A"/>
<span class="text-label-md font-label-md text-on-surface">Google</span>
</button>
<button class="h-14 rounded-2xl neumorphic-button flex items-center justify-center gap-sm hover:scale-[1.02] transition-transform">
<span class="material-symbols-outlined text-on-surface text-xl" data-icon="apple">ios</span>
<span class="text-label-md font-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Footer Link -->
<footer class="text-center pt-md">
<p class="text-body-md font-body-md text-secondary">
                Don't have an account? 
                <a class="text-primary-container font-bold hover:underline" href="#">Register Now</a>
</p>
</footer>
</div>
<!-- Background Decoration (Optional for depth demonstration) -->
<div class="fixed top-10 left-10 w-32 h-32 rounded-full neumorphic-flat opacity-50 -z-10"></div>
<div class="fixed bottom-20 right-10 w-48 h-48 rounded-[64px] neumorphic-flat opacity-30 -z-10 rotate-12"></div>
</body></html>
