<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        theme: {

            "colors": {
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-primary-container": "#004242",
                    "inverse-on-surface": "#edf2f1",
                    "on-primary-fixed-variant": "#004f50",
                    "inverse-primary": "#74d6d6",
                    "on-tertiary-fixed": "#351000",
                    "error": "#ba1a1a",

                    "on-primary": "#ffffff",
                    "on-secondary-fixed-variant": "#38485d",
                    "tertiary-fixed": "#ffdbcc",
                    "surface": "#f6faf9",
                    "on-surface-variant": "#3e4949",
                    "surface-container-high": "#e5e9e8",
                    "primary-fixed-dim": "#74d6d6",
                    "on-tertiary-container": "#632906",
                    "outline-variant": "#bdc9c8",
                    "secondary-fixed": "#d3e4fe",
                    "primary-container": "#4fb3b3",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f6faf9",
                    "tertiary": "#914c27",
                    "surface-variant": "#dfe3e3",
                    "on-secondary": "#ffffff",
                    "on-error": "#ffffff",
                    "primary": "#006a6a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f0f4f4",
                    "surface-container": "#eaefee",
                    "secondary": "#505f76",
                    "inverse-surface": "#2c3131",
                    "surface-container-highest": "#dfe3e3",
                    "error-container": "#ffdad6",
                    "secondary-container": "#d0e1fb",
                    "on-primary-fixed": "#002020",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#181c1c",
                    "tertiary-fixed-dim": "#ffb693",
                    "on-background": "#181c1c",
                    "outline": "#6e7979",
                    "tertiary-container": "#e48f65",
                    "on-tertiary-fixed-variant": "#733512",
                    "background": "#f6faf9",
                    "surface-tint": "#006a6a",
                    "primary-fixed": "#91f3f2",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "md": "24px",
                    "margin": "32px",
                    "sm": "12px",
                    "gutter": "24px",
                    "xl": "64px",
                    "unit": "8px",
                    "lg": "48px"
            },
            "fontFamily": {
                    "headline-xl": ["Manrope"],
                    "headline-md": ["Manrope"],
                    "body-md": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "label-sm": ["Manrope"],
                    "label-md": ["Manrope"]
            },
            "fontSize": {
                    "headline-xl": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],

                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .neumorphic-extruded {
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }
        .neumorphic-inset {
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff;
        }
        .neumorphic-extruded-sm {
            box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #ffffff;
        }
        .neumorphic-clay-teal {
            background-color: #4FB3B3;
            box-shadow: 6px 6px 12px #3e8d8d, -6px -6px 12px #60d9d9, inset 2px 2px 4px rgba(255,255,255,0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-slate-100 text-on-background font-body-md min-h-screen">
<!-- Top AppBar (Shared Component Logic) -->
<header class="bg-slate-100 shadow-[4px_4px_10px_#d1d9e6,-4px_-4px_10px_#ffffff] flex justify-between items-center w-full px-6 py-4 fixed top-0 z-50">
<div class="flex items-center gap-4">
    <a href="dashboard.html">
<span class="material-symbols-outlined text-[#4FB3B3] cursor-pointer hover:scale-105 transition-transform" data-icon="arrow_back">arrow_back</span>
</a>
<h1 class="text-xl font-extrabold text-[#4FB3B3] font-['Manrope']">MindfulTasks</h1>
</div>
<div class="flex items-center gap-4">
<div class="neumorphic-extruded-sm rounded-full p-2 cursor-pointer hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[#4FB3B3]" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<main class="pt-24 pb-32 px-4 md:px-margin max-w-4xl mx-auto">
<!-- Header Section -->
<div class="mb-lg">
<h2 class="text-headline-lg font-headline-lg text-on-surface">Create New Task</h2>
<p class="text-body-md text-slate-500">Organize your workflow with tactile precision.</p>
</div>
<!-- Main Form Card -->
<div class="neumorphic-extruded bg-slate-100 rounded-[32px] p-8 md:p-12 space-y-md">
<!-- Task Title -->
<div class="space-y-xs">
<label class="text-label-md text-slate-600 block px-2">Task Title</label>
<div class="neumorphic-inset rounded-2xl p-1">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-body-lg placeholder:text-slate-400" placeholder="What needs to be done?" type="text"/>
</div>
</div>
<!-- Description -->
<div class="space-y-xs">
<label class="text-label-md text-slate-600 block px-2">Description</label>
<div class="neumorphic-inset rounded-2xl p-1">
<textarea class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-body-md placeholder:text-slate-400 resize-none" placeholder="Add some context or notes..." rows="4"></textarea>
</div>
</div>
<!-- Category & Priority Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Category Chips -->
<div class="space-y-sm">
<label class="text-label-md text-slate-600 block px-2">Category</label>
<div class="flex flex-wrap gap-3">
<button class="neumorphic-clay-teal text-white px-5 py-2 rounded-full text-label-md transition-all active:scale-95">Design</button>
<button class="neumorphic-extruded-sm bg-slate-100 text-slate-600 px-5 py-2 rounded-full text-label-md hover:text-[#4FB3B3] transition-all">Development</button>
<button class="neumorphic-extruded-sm bg-slate-100 text-slate-600 px-5 py-2 rounded-full text-label-md hover:text-[#4FB3B3] transition-all">Marketing</button>
</div>
</div>
<!-- Priority Buttons -->
<div class="space-y-sm">
<label class="text-label-md text-slate-600 block px-2">Priority</label>
<div class="flex gap-3">
<button class="flex-1 neumorphic-extruded-sm bg-slate-100 py-2 rounded-xl text-label-sm flex flex-col items-center gap-1 active:neumorphic-inset transition-all">
<span class="w-2 h-2 rounded-full bg-error"></span>
                            High
                        </button>
<button class="flex-1 neumorphic-inset bg-slate-100 py-2 rounded-xl text-label-sm flex flex-col items-center gap-1 text-[#4FB3B3]">
<span class="w-2 h-2 rounded-full bg-tertiary-container"></span>
                            Medium
                        </button>
<button class="flex-1 neumorphic-extruded-sm bg-slate-100 py-2 rounded-xl text-label-sm flex flex-col items-center gap-1 active:neumorphic-inset transition-all">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
                            Low
                        </button>
</div>
</div>
</div>
<!-- Due Date & Subtasks -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="text-label-md text-slate-600 block px-2">Due Date</label>
<div class="neumorphic-inset rounded-2xl p-1 flex items-center pr-4">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-body-md text-slate-600" type="date"/>
<span class="material-symbols-outlined text-slate-400" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="space-y-xs">
<label class="text-label-md text-slate-600 block px-2">Subtasks</label>
<div class="flex gap-2">
<div class="neumorphic-inset rounded-2xl p-1 flex-1">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-2 text-body-md" placeholder="Add item..." type="text"/>
</div>
<button class="neumorphic-extruded-sm bg-slate-100 rounded-2xl p-3 text-[#4FB3B3] hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</div>
<!-- File Upload -->
<div class="space-y-sm">
<label class="text-label-md text-slate-600 block px-2">Reference Images (Before)</label>
<div class="neumorphic-inset rounded-[24px] p-8 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 gap-3 hover:bg-slate-50 transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform" data-icon="cloud_upload">cloud_upload</span>
<p class="text-label-md">Drag and drop or click to upload</p>
</div>
<div class="grid grid-cols-4 gap-4 mt-4">
<div class="aspect-square neumorphic-extruded-sm rounded-xl overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A soft-lit photograph of a clean, minimalist workspace with a sleek laptop and a notepad on a light grey desk. The image is framed to evoke a sense of productivity and calm, with gentle shadows that mimic the neumorphic UI design of the application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCz-R-4Ei08VnXYL4hy0CkW7E0Ll5vI0Wg_S7ZnmKMPv3xuInoTny3FxMrwG-2ImF0A-gYTCl5-WTr_8UeyInniPXXHJNdyLD8HzIJ0WnPMDkQ5lvsu5YY2tx0M0uf2iGGQ0mVPSX2yEuwLIN85iVCxH05XM8genHsvlw12iq5V-b4Fc-uc_j80QdEA_5haazQUbU6GqBNZj-6ME5aAw2mNUq-c3StRutMNxUSv_v6lbAvYacQsdJ03e1XUCm1rf8syyVH6x4J8ZZM"/>
<button class="absolute top-1 right-1 bg-white/80 rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined text-xs text-error" data-icon="close">close</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-md">
<button class="w-full neumorphic-clay-teal py-5 rounded-[24px] text-white font-headline-md flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="task_alt">task_alt</span>
                    Create Task
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Logic) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-slate-100 px-2 pb-6 pt-3 border-t border-slate-200/50 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] rounded-t-3xl md:hidden">
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-[#4FB3B3] transition-colors cursor-pointer active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span class="font-['Manrope'] text-[10px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#4FB3B3] shadow-[inset_2px_2px_5px_#b8bfc9,inset_-2px_-2px_5px_#ffffff] rounded-xl px-4 py-2 cursor-pointer active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-['Manrope'] text-[10px] font-medium">Tasks</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-[#4FB3B3] transition-colors cursor-pointer active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-['Manrope'] text-[10px] font-medium">Calendar</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-[#4FB3B3] transition-colors cursor-pointer active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Manrope'] text-[10px] font-medium">Profile</span>
</div>
</nav>
<!-- Desktop SideNav (Logic-based addition for completeness) -->
<aside class="hidden md:flex fixed left-0 top-0 h-full w-20 flex-col items-center py-margin gap-8 bg-slate-100 shadow-[4px_0_15px_rgba(0,0,0,0.05)] z-40">
<div class="p-2 mb-4">
<span class="material-symbols-outlined text-[#4FB3B3] text-3xl font-bold" data-icon="psychology">psychology</span>
</div>
<div class="flex flex-col gap-6">
<div class="neumorphic-extruded-sm p-3 rounded-2xl cursor-pointer text-slate-400 hover:text-[#4FB3B3] transition-all">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
</div>
<div class="neumorphic-inset p-3 rounded-2xl cursor-pointer text-[#4FB3B3]">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
</div>
<div class="neumorphic-extruded-sm p-3 rounded-2xl cursor-pointer text-slate-400 hover:text-[#4FB3B3] transition-all">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</div>
<div class="neumorphic-extruded-sm p-3 rounded-2xl cursor-pointer text-slate-400 hover:text-[#4FB3B3] transition-all">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</div>
</aside>
</body></html>
